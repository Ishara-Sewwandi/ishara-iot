<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fish Monitoring - Live Stream</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        
        .status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }
        
        .status.connected {
            background: #10b981;
            color: white;
        }
        
        .status.disconnected {
            background: #ef4444;
            color: white;
        }
        
        .main-content {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }
        
        .video-panel {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .video-container {
            position: relative;
            background: #000;
            border-radius: 5px;
            overflow: hidden;
        }
        
        #videoFeed {
            width: 100%;
            height: auto;
            display: block;
        }
        
        .stats-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 14px;
        }
        
        .stats-overlay div {
            margin: 5px 0;
        }
        
        .info-panel {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .fish-card {
            background: #f3f4f6;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #3b82f6;
        }
        
        .fish-card.critical {
            border-left-color: #ef4444;
            background: #fee2e2;
        }
        
        .fish-card.warning {
            border-left-color: #f59e0b;
            background: #fef3c7;
        }
        
        .fish-card h3 {
            margin-bottom: 10px;
            color: #333;
        }
        
        .health-info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 10px;
        }
        
        .health-item {
            font-size: 13px;
            color: #666;
        }
        
        .health-item strong {
            color: #333;
        }
        
        .alert-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            background: #ef4444;
            color: white;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        
        .btn-primary {
            background: #3b82f6;
            color: white;
        }
        
        .btn-danger {
            background: #ef4444;
            color: white;
        }
        
        @media (max-width: 968px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🐟 Fish Monitoring System - Live Stream</h1>
            <p>Real-time fish detection and health monitoring</p>
            <div style="margin-top: 10px;">
                <span id="connectionStatus" class="status disconnected">Disconnected</span>
                <span style="margin-left: 20px; color: #666;">
                    Server: <strong id="serverUrl">Not connected</strong>
                </span>
            </div>
        </header>
        
        <div class="main-content">
            <div class="video-panel">
                <h2>Live Feed</h2>
                <div class="video-container">
                    <img id="videoFeed" alt="Waiting for stream..." />
                    <div class="stats-overlay">
                        <div>FPS: <strong id="fps">0.0</strong></div>
                        <div>Fish Count: <strong id="fishCount">0</strong></div>
                        <div>Latency: <strong id="latency">0 ms</strong></div>
                    </div>
                </div>
                
                <div class="controls">
                    <button class="btn-primary" onclick="connect()">Connect</button>
                    <button class="btn-danger" onclick="disconnect()">Disconnect</button>
                </div>
            </div>
            
            <div class="info-panel">
                <h2>Detected Fish</h2>
                <div id="detectionList">
                    <p style="color: #999; text-align: center; padding: 20px;">
                        Waiting for detections...
                    </p>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let socket = null;
        let lastUpdateTime = Date.now();
        const SERVER_URL = 'http://192.168.1.100:5000';  // Change this to your Raspberry Pi IP
        
        function connect() {
            if (socket && socket.connected) {
                console.log('Already connected');
                return;
            }
            
            document.getElementById('serverUrl').textContent = SERVER_URL;
            
            socket = io(SERVER_URL, {
                transports: ['websocket', 'polling']
            });
            
            socket.on('connect', () => {
                console.log('Connected to server');
                document.getElementById('connectionStatus').className = 'status connected';
                document.getElementById('connectionStatus').textContent = 'Connected';
                socket.emit('start_stream');
            });
            
            socket.on('disconnect', () => {
                console.log('Disconnected from server');
                document.getElementById('connectionStatus').className = 'status disconnected';
                document.getElementById('connectionStatus').textContent = 'Disconnected';
            });
            
            socket.on('detection_update', (data) => {
                handleDetectionUpdate(data);
            });
            
            socket.on('connection_response', (data) => {
                console.log('Server message:', data.message);
            });
        }
        
        function disconnect() {
            if (socket) {
                socket.emit('stop_stream');
                socket.disconnect();
                socket = null;
            }
        }
        
        function handleDetectionUpdate(data) {
            try {
                // Calculate latency
                const now = Date.now();
                const latency = now - lastUpdateTime;
                lastUpdateTime = now;
                
                // Update stats
                document.getElementById('fps').textContent = data.fps.toFixed(1);
                document.getElementById('fishCount').textContent = data.fish_count;
                document.getElementById('latency').textContent = latency + ' ms';
                
                // Update video feed
                const imgElement = document.getElementById('videoFeed');
                imgElement.src = 'data:image/jpeg;base64,' + data.frame;
                
                // Update detection list
                updateDetectionList(data.detections);
                
            } catch (error) {
                console.error('Error handling update:', error);
            }
        }
        
        function updateDetectionList(detections) {
            const listElement = document.getElementById('detectionList');
            
            if (detections.length === 0) {
                listElement.innerHTML = '<p style="color: #999; text-align: center; padding: 20px;">No fish detected</p>';
                return;
            }
            
            let html = '';
            
            detections.forEach(fish => {
                const health = fish.health;
                let cardClass = 'fish-card';
                let healthIcon = '🟢';
                
                if (health) {
                    if (health.is_critical) {
                        cardClass += ' critical';
                        healthIcon = '🔴';
                    } else if (!health.is_healthy) {
                        cardClass += ' warning';
                        healthIcon = '🟠';
                    }
                }
                
                html += `
                    <div class="${cardClass}">
                        <h3>${healthIcon} Fish #${fish.id}</h3>
                        <div class="health-item">
                            <strong>Detection:</strong> ${(fish.confidence * 100).toFixed(1)}%
                        </div>
                        ${health ? `
                            <div class="health-info">
                                <div class="health-item">
                                    <strong>Health:</strong> ${health.class.toUpperCase()}
                                </div>
                                <div class="health-item">
                                    <strong>Confidence:</strong> ${(health.confidence * 100).toFixed(1)}%
                                </div>
                            </div>
                            ${health.is_critical ? '<div style="margin-top: 10px;"><span class="alert-badge">⚠️ CRITICAL</span></div>' : ''}
                        ` : ''}
                    </div>
                `;
            });
            
            listElement.innerHTML = html;
        }
        
        // Auto-connect on page load
        window.onload = () => {
            console.log('Page loaded, attempting connection...');
            setTimeout(connect, 1000);
        };
        
        // Cleanup on page unload
        window.onbeforeunload = () => {
            if (socket) {
                socket.disconnect();
            }
        };
    </script>
</body>
</html>
